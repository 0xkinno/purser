<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<title>S01 Hook</title>
</head>
<body>
<div class="scene dark">
  <div class="abs" style="inset:0;background:radial-gradient(ellipse 60% 60% at 50% 50%, #1c1813 0%, #0c0a08 70%, #040302 100%);"></div>

  <!-- Animated counter block -->
  <div class="abs in f" id="counter-box" style="top:220px;left:0;right:0;text-align:center;">
    <div class="lab" style="color:var(--color-ink-3);margin-bottom:16px;letter-spacing:0.2em;">RECOVERY STRESS TEST &middot; BATCH SEED 004</div>
    <div id="counter" class="mono" style="font-size:110px;font-weight:700;letter-spacing:-0.03em;color:#fff;transition:color 0.2s;">
      ticket 071 <span class="dot" style="background:var(--color-signal);vertical-align:middle;margin-left:12px;box-shadow:0 0 16px var(--color-signal);"></span>
    </div>
    <div id="status-line" class="mono" style="font-size:22px;margin-top:20px;color:var(--color-ink-3);height:32px;">
      in-flight &middot; processing queue
    </div>
  </div>

  <!-- Red flatline beam -->
  <div id="beam" style="position:absolute;top:315px;left:0;right:0;height:4px;background:var(--color-alarm);box-shadow:0 0 24px var(--color-alarm);transform:scaleX(0);transform-origin:left;transition:transform 0.35s cubic-bezier(.2,1,.3,1);"></div>

  <!-- Headlines -->
  <div class="abs in f" id="headline-box" style="top:470px;left:0;right:0;text-align:center;">
    <h1 class="h1" style="color:#fff;margin-bottom:12px;">It crashed at ticket 73.</h1>
    <h2 class="h2" style="color:var(--color-paper);font-size:58px;">Who got paid <em>twice</em>?</h2>
    
    <div class="in f" id="brand-fade" style="margin-top:54px;display:flex;align-items:center;justify-content:center;gap:18px;">
      <div style="width:44px;height:44px;"></div>
      <span class="font-serif" style="font-family:var(--serif);font-size:46px;letter-spacing:-0.02em;color:var(--color-paper);">Purser</span>
      <span class="pill a" style="font-size:13px;padding:4px 14px;">Autonomous Refund Operations</span>
    </div>
  </div>
</div>

<script>
window.WIPE = "#16130F";
hud("0:00 - 0:19", "S01");

window.run = function() {
  on("#counter-box", 0.3);
  at(0.9, () => {
    $("#counter").innerHTML = 'ticket 072 <span class="dot" style="background:var(--color-signal);vertical-align:middle;margin-left:12px;box-shadow:0 0 16px var(--color-signal);"></span>';
  });
  at(1.7, () => {
    $("#counter").innerHTML = 'ticket 073 <span class="dot" style="background:var(--color-signal);vertical-align:middle;margin-left:12px;box-shadow:0 0 16px var(--color-signal);"></span>';
  });
  at(2.5, () => {
    // Kill trigger
    $("#beam").style.transform = "scaleX(1)";
    $("#counter").style.color = "var(--color-alarm)";
    $("#counter").innerHTML = 'ticket 073 <span class="dot" style="background:var(--color-alarm);vertical-align:middle;margin-left:12px;box-shadow:0 0 20px var(--color-alarm);"></span>';
    $("#status-line").innerHTML = '<span style="color:var(--color-alarm);font-weight:700;">process killed &middot; SIGKILL (signal 9)</span>';
  });
  at(3.6, () => {
    on("#headline-box", 0.1);
  });
  at(5.0, () => {
    on("#brand-fade", 0.1);
  });
};
</script>
</body>
</html>
